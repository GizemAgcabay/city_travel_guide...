<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mekan Detayları | Adana Gezi Rehberi</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header class="navbar">
        <a class="logo" href="index.html">adana<span>.</span></a>
        <nav class="main-nav" aria-label="Ana menü">
            <a href="index.html">Gezilecek Yerler</a>
            <a href="details.html">Mekan Detayları</a>
            <a href="suggest.html">Mekan Öner</a>
            <a href="fees-hours.html">Ücretler ve Saatler</a>
        </nav>
    </header>

    <main>
        <section class="page-banner">
            <h1>Mekan Detayları</h1>
            <p>Adana'da gezilecek yerlerin fotoğrafları ve ziyaret bilgileri.</p>
        </section>

        <div id="place-details"></div>

        <template id="detail-template">
            <article>
                <header class="detail-hero">
                    <img alt="" loading="lazy" hidden>
                    <div>
                        <p class="subtitle" data-field="category"></p>
                        <h2 data-field="name"></h2>
                        <p data-field="lead"></p>
                    </div>
                </header>

                <div class="detail-content">
                    <div>
                        <h3>Mekan Hakkında</h3>
                        <p data-field="description"></p>
                        <div class="highlights">
                            <h3>Öne Çıkan Özellikler</h3>
                            <ul></ul>
                        </div>
                    </div>

                    <aside class="info-box">
                        <h3>Ziyaret Bilgileri</h3>
                        <p><strong>Şehir ve konum</strong><br><span data-field="location"></span></p>
                        <p class="transport"><strong>Ulaşım</strong><br><span data-field="transport"></span></p>
                        <p data-field="tip"></p>
                        <a class="text-button" href="fees-hours.html">Ücretler ve saatler</a>
                    </aside>
                </div>
            </article>
        </template>
    </main>

    <footer class="site-footer">
        <a class="logo" href="index.html">adana<span>.</span></a>
        <p>Adana Gezi Rehberi · Öğrenci Projesi</p>
    </footer>
</body>
</html>
